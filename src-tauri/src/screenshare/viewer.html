<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>화면 보기 — My Space</title>
    <style>
      :root {
        color-scheme: dark;
        --fg: #e8e8e8;
        --muted: #9b9b9b;
        --line: #35383d;
        --brand: #862688;
        --err: #e01e5a;
        --ok: #2bac76;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: #0e1013;
        color: var(--fg);
        font:
          15px/1.46667 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: #17191d;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--muted);
        flex: none;
      }
      .dot.live {
        background: var(--ok);
        box-shadow: 0 0 0 4px rgba(43, 172, 118, 0.18);
      }
      .dot.err {
        background: var(--err);
      }
      #state {
        font-weight: 700;
        font-size: 13px;
      }
      .spacer {
        flex: 1;
      }
      button {
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
        background: transparent;
        color: var(--fg);
      }
      button:hover {
        background: #23262b;
      }
      main {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      video,
      #frame {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        display: block;
      }
      #frame {
        display: none;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-align: center;
        padding: 24px;
        background: #0e1013;
      }
      #overlay[hidden] {
        display: none;
      }
      #overlay .big {
        font-size: 17px;
        font-weight: 700;
      }
      #overlay .small {
        color: var(--muted);
        font-size: 13px;
        max-width: 420px;
      }
      .spin {
        width: 22px;
        height: 22px;
        border: 2px solid var(--line);
        border-top-color: var(--brand);
        border-radius: 999px;
        animation: spin 0.8s linear infinite;
        margin-bottom: 4px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <span id="state">연결 중…</span>
      <span class="spacer"></span>
      <!-- 이 화면을 다른 사람에게도 넘길 수 있게 지금 주소를 복사해 준다. -->
      <button id="copy">주소 복사</button>
      <button id="sound">소리 켜기</button>
      <button id="full">전체화면</button>
    </header>
    <main>
      <video id="video" autoplay muted playsinline></video>
      <!-- 릴레이 폴백일 때 그리는 자리(JPEG 프레임). P2P 가 붙으면 다시 숨는다. -->
      <img id="frame" alt="공유 화면" />
      <div id="overlay">
        <div class="spin"></div>
        <div class="big">공유를 기다리고 있습니다</div>
        <div class="small">
          공유하는 사람이 화면 선택을 마치면 자동으로 표시됩니다.
        </div>
      </div>
    </main>

    <script>
      const token = decodeURIComponent(location.pathname.split("/").pop() || "")
      const wsBase =
        (location.protocol === "https:" ? "wss:" : "ws:") + "//" + location.host

      const RTC_CONFIG = {
        iceServers: [
          {
            urls: [
              "stun:stun.l.google.com:19302",
              "stun:stun1.l.google.com:19302",
            ],
          },
        ],
      }

      const el = (id) => document.getElementById(id)
      let ws = null
      let pc = null

      // ── 릴레이 폴백 ────────────────────────────────────────────────
      // 영상은 원래 P2P 로 직접 받는다. 다른 망에서 NAT·방화벽에 막히면(TURN 서버가
      // 없으므로 흔하다) 앱을 거쳐 JPEG 프레임을 받는 쪽으로 물러난다 — 화질은 낮지만
      // URL 이 열리는 곳이면 무조건 보인다.
      /** P2P 가 이 시간 안에 붙지 않으면 릴레이로 넘어간다. */
      const P2P_TIMEOUT_MS = 8000
      let relaying = false
      let connectTimer = null
      /** 직전 프레임의 objectURL — 해제하지 않으면 메모리가 계속 늘어난다. */
      let frameUrl = null

      function requestRelay() {
        if (relaying) return
        relaying = true
        send({ type: "relay", on: true })
        el("video").style.display = "none"
        el("frame").style.display = "block"
        el("overlay").hidden = true
        setState("보는 중 (릴레이 · 저화질)", "live")
      }

      function stopRelaying() {
        if (!relaying) return
        relaying = false
        send({ type: "relay", on: false })
        el("frame").style.display = "none"
        el("video").style.display = "block"
        if (frameUrl) {
          URL.revokeObjectURL(frameUrl)
          frameUrl = null
        }
      }

      function renderFrame(blob) {
        const url = URL.createObjectURL(blob)
        el("frame").src = url
        // 새 프레임을 걸고 나서 옛 URL 을 해제한다(먼저 해제하면 렌더가 깨진다).
        if (frameUrl) URL.revokeObjectURL(frameUrl)
        frameUrl = url
        el("overlay").hidden = true
      }

      function setState(text, kind) {
        el("state").textContent = text
        el("dot").className = "dot" + (kind ? " " + kind : "")
      }

      function overlay(big, small, spinning) {
        el("overlay").hidden = false
        el("overlay").querySelector(".big").textContent = big
        el("overlay").querySelector(".small").textContent = small
        el("overlay").querySelector(".spin").style.display = spinning
          ? ""
          : "none"
      }

      function connect() {
        ws = new WebSocket(
          wsBase + "/ws?role=viewer&token=" + encodeURIComponent(token)
        )
        ws.onopen = () => setState("연결됨 — 공유 대기 중")
        ws.onclose = () => {
          setState("연결이 끊겼습니다", "err")
          overlay(
            "연결이 끊겼습니다",
            "공유하는 사람의 My Space 가 꺼졌거나 네트워크가 바뀌었습니다. 3초 후 다시 시도합니다.",
            true
          )
          teardown()
          setTimeout(connect, 3000)
        }
        ws.onmessage = (ev) => {
          // 문자열이 아니면 릴레이 프레임(JPEG Blob)이다.
          if (typeof ev.data !== "string") {
            renderFrame(ev.data)
            return
          }
          handle(JSON.parse(ev.data))
        }
      }

      function send(msg) {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg))
      }

      async function handle(msg) {
        switch (msg.type) {
          case "waiting":
            setState("공유 대기 중")
            overlay(
              "공유를 기다리고 있습니다",
              "공유하는 사람이 화면 선택을 마치면 자동으로 표시됩니다.",
              true
            )
            break

          case "offer":
            await accept(msg.sdp)
            break

          case "candidate":
            if (pc && msg.candidate)
              await pc.addIceCandidate(msg.candidate).catch(() => {})
            break

          case "sender-gone":
            setState("공유가 종료되었습니다")
            overlay(
              "공유가 종료되었습니다",
              "다시 공유가 시작되면 자동으로 이어집니다.",
              true
            )
            // 릴레이도 해제한다 — 공유가 다시 시작되면 먼저 P2P(고화질)를 시도해야 한다.
            stopRelaying()
            teardown()
            break
        }
      }

      async function accept(sdp) {
        teardown()
        // 이미 릴레이로 보고 있다면 화면을 가리지 않는다 — 뒤에서 조용히 P2P 로
        // 올라가려 시도하는 것이므로, 실패해도 사용자는 계속 보고 있어야 한다.
        if (!relaying) {
          setState("영상 연결 중…")
          overlay("영상을 연결하고 있습니다", "잠시만 기다려 주세요.", true)
        }

        pc = new RTCPeerConnection(RTC_CONFIG)
        pc.ontrack = (e) => {
          el("video").srcObject = e.streams[0]
        }
        pc.onicecandidate = (e) => {
          if (e.candidate) send({ type: "candidate", candidate: e.candidate })
        }
        pc.onconnectionstatechange = () => {
          if (pc.connectionState === "connected") {
            // P2P 가 붙었다 — 릴레이를 쓰고 있었다면 여기서 고화질로 돌아온다.
            clearTimeout(connectTimer)
            stopRelaying()
            el("overlay").hidden = true
            setState("보는 중", "live")
          } else if (
            pc.connectionState === "failed" ||
            pc.connectionState === "disconnected"
          ) {
            // 신호(SDP·ICE)는 앱을 거치지만 영상은 P2P 직접 연결이다. TURN 서버가
            // 없으므로 다른 망에서는 여기서 막히는 일이 흔하다 → 릴레이로 물러난다.
            requestRelay()
          }
        }

        // 붙지도, 실패로 떨어지지도 않고 한참 매달려 있는 경우가 있다
        // (candidate 를 계속 시도하는 중). 마냥 기다리면 검은 화면만 보이므로 끊어 준다.
        clearTimeout(connectTimer)
        connectTimer = setTimeout(() => {
          if (!pc || pc.connectionState !== "connected") requestRelay()
        }, P2P_TIMEOUT_MS)

        await pc.setRemoteDescription({ type: "offer", sdp })
        const answer = await pc.createAnswer()
        await pc.setLocalDescription(answer)
        send({ type: "answer", sdp: answer.sdp })
      }

      function teardown() {
        clearTimeout(connectTimer)
        if (pc) {
          try {
            pc.close()
          } catch (e) {}
          pc = null
        }
        el("video").srcObject = null
      }

      // 지금 보고 있는 주소를 복사한다(같은 화면을 다른 사람에게도 전달할 때).
      el("copy").addEventListener("click", async () => {
        const button = el("copy")
        try {
          await navigator.clipboard.writeText(location.href)
          button.textContent = "복사됨"
        } catch (e) {
          button.textContent = "주소창에서 복사하세요"
        }
        setTimeout(() => {
          button.textContent = "주소 복사"
        }, 1800)
      })

      // 소리가 있는 영상은 자동재생이 막히므로 muted 로 시작하고 사용자가 켜게 한다.
      el("sound").addEventListener("click", () => {
        const v = el("video")
        v.muted = !v.muted
        el("sound").textContent = v.muted ? "소리 켜기" : "소리 끄기"
        if (!v.muted) v.play().catch(() => {})
      })

      el("full").addEventListener("click", () => {
        const target = document.querySelector("main")
        if (document.fullscreenElement) document.exitFullscreen()
        else target.requestFullscreen().catch(() => {})
      })

      if (!window.RTCPeerConnection) {
        // http://<LAN IP> 로 열면 secure context 가 아니라 WebRTC 가 아예 없다.
        setState("이 주소로는 화면을 볼 수 없습니다", "err")
        overlay(
          "https 주소로 열어야 합니다",
          "브라우저는 보안 연결(https)에서만 화면 수신을 허용합니다. 공유한 사람에게 https 로 시작하는 주소를 다시 받아 주세요.",
          false
        )
      } else {
        connect()
      }
    </script>
  </body>
</html>
