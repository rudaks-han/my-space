[package]
name = "my-space"
version = "0.0.6"
description = "My Space - 업무용 통합 앱"
authors = ["rudaks"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "my_space_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
tauri-plugin-log = "2"
# `unstable`: 한 창에 여러 자식 웹뷰를 임베드(add_child)하기 위해 필요 — 브라우저 탭 구현에 사용.
# `devtools`: 웹뷰 개발자도구를 릴리스 빌드에서도 사용 가능하게 한다 (debug 빌드는 원래 기본 활성).
tauri = { version = "2", features = ["macos-private-api", "unstable", "devtools", "tray-icon"] }
tauri-plugin-opener = "2"
# GitHub 릴리스 기반 자동 업데이트: 새 버전 확인·다운로드·설치.
tauri-plugin-updater = "2"
# 업데이트 설치 후 앱을 재시작(relaunch)하는 데 사용.
tauri-plugin-process = "2"
# 작업 상태 변화(입력 대기·작업 완료) 시 macOS 시스템 알림을 띄우는 데 사용.
tauri-plugin-notification = "2"
# 네이티브 파일 열기/저장 다이얼로그(프론트 @tauri-apps/plugin-dialog).
tauri-plugin-dialog = "2"
# 로그인 시 자동 실행(macOS 는 ~/Library/LaunchAgents 플리스트 방식 — 권한 프롬프트 없음).
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Slack/Google API 호출용 HTTP 클라이언트. macOS 는 native-tls(Secure Transport)를 써서 OpenSSL 불필요.
# `blocking`: 앱 종료(RunEvent::Exit) 기록은 프로세스가 사라지기 전에 반드시 전송돼야 해서
# firebase.rs 가 동기 클라이언트를 별도 스레드에서 쓴다(async 로는 전송 전에 죽는다).
reqwest = { version = "0.12", features = ["json", "blocking"] }
# Slack rate-limit(429) 백오프 대기 + Google OAuth 루프백 대기에 tokio 사용.
# 화면공유 서버(axum)를 위해 net/rt-multi-thread 도 필요하다.
tokio = { version = "1", features = [
  "time",
  "sync",
  "net",
  "rt-multi-thread",
  "io-util",
  "macros",
] }
# Google 캘린더: 오늘 날짜 경계(로컬 타임존) 계산.
chrono = "0.4"
# OAuth 인증 URL 파라미터 인코딩/디코딩.
urlencoding = "2"
# Gmail 메시지 본문(payload.body.data)은 base64url 로 인코딩돼 있어 디코딩에 사용.
base64 = "0.22"
# IntelliJ 실행 설정(.idea/runConfigurations/*.xml) 파싱용 경량 read-only XML 파서.
roxmltree = "0.20"
# 사내 LDAP 로그인·비밀번호 변경. 동기 API(`sync`)는 안 쓰므로 default-features 는 끄고,
# TLS 만 켠다 — AD 는 평문 연결에서 비밀번호 변경(unicodePwd 수정)을 거부하므로 LDAPS 가 필수다.
# 백엔드가 rustls 가 아니라 native-tls 인 것은 의도다: native-tls 는 이미 의존성 트리에 있어
# 추가 빌드 부담이 없는 반면, ldap3 의 tls-rustls 는 rustls 0.21 을 끌어와 screenshare 가 쓰는
# 0.23 과 두 벌이 된다.
ldap3 = { version = "0.11", default-features = false, features = ["tls-native"] }

# ── Kafka 뷰어 ──
# Kafka 는 HTTP 가 아니라 TCP 바이너리 프로토콜이라 웹뷰에서 직접 붙을 수 없다.
# librdkafka(C) 바인딩을 번들 소스에서 빌드한다 — 첫 컴파일만 수 분, 이후 증분.
# 사내 브로커가 PLAINTEXT 라 ssl/gssapi 는 끄고(OpenSSL 의존 회피),
# 프로듀서가 압축해 넣은 메시지를 읽으려면 코덱이 필요해 gzip(libz)/zstd 만 켠다
# (snappy·lz4 는 librdkafka 에 기본 내장).
rdkafka = { version = "0.37", default-features = false, features = ["libz", "zstd"] }

# ── Flex 로그인: 자격증명 로컬 암호화 + Chrome 의 flex.team 쿠키 재사용(chrome_cookies.rs) ──
# Chrome 쿠키 SQLite DB 읽기(시스템 SQLite 의존 없이 번들 컴파일).
rusqlite = { version = "0.31", features = ["bundled"] }
# 저장 값 암·복호화 + Chrome 쿠키 복호화: AES-128-CBC.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
# 비밀값 → AES 키/IV 유도: PBKDF2-HMAC-SHA1.
pbkdf2 = "0.12"
sha1 = "0.10"

# ── 화면공유 ──
# WKWebView 는 getDisplayMedia() 를 지원하지 않으므로(Apple 이 임베드 웹뷰엔 getUserMedia 만 허용)
# 앱은 "서버" 역할만 한다: 송신 페이지·시청 페이지를 서빙하고 WebRTC signaling(SDP/ICE)을 중계한다.
# 실제 화면 캡처와 인코딩은 시스템 브라우저(Chrome/Safari)가 하므로 비디오 코덱 의존이 전혀 없다.
axum = { version = "0.8", features = ["ws"] }
# graceful shutdown + rustls TLS 종단. rustls 는 순수 Rust 라 OpenSSL 이 필요 없다.
axum-server = { version = "0.7", features = ["tls-rustls"] }
# 프로세스 시작 시 CryptoProvider 를 명시적으로 설치하기 위해 직접 참조한다.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# LAN 시청자는 https 여야 한다 — RTCPeerConnection 이 secure context 전용이라
# http://<LAN IP> 로는 WebRTC 가 아예 시작되지 않는다. 자체 서명 인증서를 실행마다 생성한다.
rcgen = "0.13"
# 공유 URL 의 추측 불가능한 토큰 생성.
rand = "0.8"
# 터미널 뷰: herdr 클라이언트를 우리가 만든 PTY 안에서 띄우고, 그 바이트를 xterm.js 에
# 그대로 흘려보낸다. 화면을 폴링해 흉내 내는 것이 아니라 herdr 자신이 그려 주므로 커서·색·
# IME·리사이즈가 전부 따라온다(src-tauri/src/pty.rs 헤더 참고).
portable-pty = "0.9.0"

# macOS 전용: 자식 웹뷰의 WKWebView 에 두 손가락 스와이프(뒤로/앞으로) 제스처를 켜기 위해
# 네이티브 ObjC 메서드(setAllowsBackForwardNavigationGestures:)를 호출한다.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
# IntelliJ 서비스 종료 시 프로세스 그룹 전체에 시그널(kill(-pgid))을 보내는 데 사용.
libc = "0.2"

# Flex 로그인 통합 테스트(#[ignore], 자격증명 환경변수 필요)에서 async 함수를 돌리는 데 사용.
[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
